# Every push and pull request to main: the types, then the whole suite twice, on PGlite and on the Postgres 17 with
# pgvector that production runs (deploy/docker-compose.yml), through the production driver. Each run is
# `npm run release-check`, which also refuses a skipped test and runs check:public. Deploy only a commit that is green
# here (docs/deploy.md). This workflow holds no secrets and no deploy key.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pglite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run release-check

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        # pgvector/pgvector:pg17, pinned by digest so a new image never changes what the tests ran on unseen.
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TORAN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release-check
