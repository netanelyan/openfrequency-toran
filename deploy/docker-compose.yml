# Toran on one VPS: Postgres with pgvector, the app (dashboard, pitch pages, webhook and worker in one process),
# and Caddy in front for HTTPS. Keys live in private/.env on the server, never in this file.
#
#   cp .env.example private/.env   (fill it in; DATABASE_URL is set below)
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec app node scripts/user-add.ts <name>   (with TORAN_NEW_PASSWORD set)
#
# Not run on the development machine (it has no Docker); see docs/deploy.md.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: toran
      POSTGRES_USER: toran
      POSTGRES_PASSWORD: ${TORAN_DB_PASSWORD:?set TORAN_DB_PASSWORD in the shell or an .env beside this file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toran -d toran"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../private/.env
    environment:
      DATABASE_URL: postgres://toran:${TORAN_DB_PASSWORD}@db:5432/toran
      TORAN_HOME: /data
    volumes:
      - ../private:/data
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
